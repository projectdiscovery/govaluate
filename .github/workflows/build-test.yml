name: 🔨 Build Test

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test Builds
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: projectdiscovery/actions/setup/go@v1

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Race Condition Tests
        if: ${{ matrix.os != 'windows-latest' }} # false positives on windows
        run: go test -race ./...
